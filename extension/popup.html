<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calm Capture</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:          #0a0a0f;
      --surface:     #111118;
      --border:      #1e1e2e;
      --text:        #e8e8f0;
      --text-muted:  #6e6e8a;
      --accent:      #5B8DEF;
      --accent-glow: rgba(91, 141, 239, 0.35);
      --green:       #3ecf8e;
      --red:         #ef5b5b;
      --font:        -apple-system, BlinkMacSystemFont, "SF Pro Text",
                     "Segoe UI", Roboto, sans-serif;
      --radius:      10px;
    }

    html {
      width: 320px;
      min-height: 200px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      padding: 0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Shell ────────────────────────────────────────────────────────── */
    .shell {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #0d0d16 0%, #0a0a0f 100%);
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .logo svg {
      width: 16px;
      height: 16px;
      fill: #fff;
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .header-text p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* ── Status card ──────────────────────────────────────────────────── */
    .status-card {
      margin: 14px 16px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.3s;
    }

    .status-card.connected {
      border-color: rgba(62, 207, 142, 0.3);
    }

    .status-card.disconnected {
      border-color: rgba(239, 91, 91, 0.25);
    }

    /* Luminous dot */
    .status-dot {
      position: relative;
      width: 10px;
      height: 10px;
      flex-shrink: 0;
    }

    .status-dot::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .status-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--accent-glow);
      animation: pulse-outer 2.4s ease-in-out infinite;
      opacity: 0;
    }

    .status-card.connected .status-dot::before {
      background: var(--green);
      box-shadow: 0 0 8px rgba(62, 207, 142, 0.6);
    }
    .status-card.connected .status-dot::after {
      background: rgba(62, 207, 142, 0.25);
    }

    .status-card.disconnected .status-dot::before {
      background: var(--red);
      animation: none;
      box-shadow: none;
    }
    .status-card.disconnected .status-dot::after {
      display: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes pulse-outer {
      0%   { transform: scale(0.8); opacity: 0.6; }
      60%  { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .status-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .status-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .status-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Hotkey hint ──────────────────────────────────────────────────── */
    .hotkey-section {
      margin: 12px 16px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hotkey-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .hotkey-badge {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding: 0 5px;
      background: #1a1a28;
      border: 1px solid #2a2a40;
      border-bottom-width: 2px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      font-family: var(--font);
      letter-spacing: 0;
    }

    .key-sep {
      font-size: 10px;
      color: #3a3a55;
    }

    /* ── Footer ───────────────────────────────────────────────────────── */
    .footer {
      margin: 14px 16px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .btn-capture {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, box-shadow 0.2s, transform 0.1s;
      box-shadow: 0 0 14px rgba(91, 141, 239, 0.4);
      font-family: var(--font);
    }

    .btn-capture:hover {
      opacity: 0.9;
      box-shadow: 0 0 20px rgba(91, 141, 239, 0.55);
    }

    .btn-capture:active {
      transform: scale(0.97);
    }

    .btn-reconnect {
      height: 32px;
      width: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      transition: border-color 0.2s;
      padding: 0;
    }

    .btn-reconnect:hover {
      border-color: var(--accent);
    }

    .btn-reconnect svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
    }

    .btn-reconnect:hover svg {
      stroke: var(--accent);
    }

    /* ── Feedback toast ───────────────────────────────────────────────── */
    #toast {
      margin: 0 16px 12px;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 11.5px;
      text-align: center;
      display: none;
      transition: opacity 0.2s;
    }

    #toast.ok {
      background: rgba(62, 207, 142, 0.12);
      border: 1px solid rgba(62, 207, 142, 0.3);
      color: var(--green);
    }

    #toast.err {
      background: rgba(239, 91, 91, 0.1);
      border: 1px solid rgba(239, 91, 91, 0.25);
      color: var(--red);
    }

    /* ── Scrollbar (for very long content) ───────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <!-- Capture crosshair icon -->
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="5" height="5" rx="1.2"/>
        <rect x="10" y="1" width="5" height="5" rx="1.2"/>
        <rect x="1" y="10" width="5" height="5" rx="1.2"/>
        <rect x="10" y="10" width="5" height="5" rx="1.2"/>
        <circle cx="8" cy="8" r="1.8"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Calm Capture</h1>
      <p>Active Inference · Knowledge Resurfacing</p>
    </div>
  </div>

  <!-- Daemon connection status -->
  <div class="status-card" id="statusCard">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text">
      <span class="status-label" id="statusLabel">Calm Capture active</span>
      <span class="status-sub" id="statusSub">Checking daemon connection…</span>
    </div>
  </div>

  <!-- Hotkey hint -->
  <div class="hotkey-section">
    <span class="hotkey-label">Capture shortcut</span>
    <div class="hotkey-badge">
      <span class="key" id="modKey">⌘</span>
      <span class="key-sep">+</span>
      <span class="key">⇧</span>
      <span class="key-sep">+</span>
      <span class="key">Y</span>
    </div>
  </div>

  <!-- Feedback toast -->
  <div id="toast"></div>

  <!-- Footer actions -->
  <div class="footer">
    <button class="btn-capture" id="btnCapture">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 1v10M1 6h10" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      Capture now
    </button>
    <button class="btn-reconnect" id="btnReconnect" title="Reconnect to daemon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4.06 13a8 8 0 0 0 15.05 1M4 5v4h4M20 19v-4h-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19.94 11A8 8 0 0 0 4.89 10" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
