version: '3.8'

services:
  inference:
    build: 
      context: ./inference
    container_name: corteon_inference
    ports:
      - "8765:8765" # WebSocket
      - "8000:8000" # API
    volumes:
      - ~/.corteon:/root/.corteon
    restart: unless-stopped
    
  dashboard:
    build:
      context: ./dashboard
    container_name: corteon_dashboard
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - inference
    restart: unless-stopped
